<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"/>
  </head>
  <body>
    <div class="container">
        <h3 class="text-center">Formulario</h3>
    <form class="row">
      <div class="col-md-6 col-sm-12">
        <label for="nombre">Nombres</label>
        <input type="text" id="nombre" placeholder="Nombre" class="form-control"/>
      </div>
      <div class="col-md-4">
        <label for="edad">Edad</label>
        <input type="number" id="edad" placeholder="Edad" class="form-control"/>
      </div>
      <div class="col-md-10">
        <label for="direccion">Direccion</label>
        <input type="text" id="direccion" placeholder="Direccion" class="form-control"/>
      </div>
      <div class="row mt-4">
        <button class="btn btn-primary col-md-5 mx-4">Guardar</button>
         <button class="btn btn-outline-danger col-md-5">Eliminar</button>
      </div>
    </form>
    </div>
    
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>
  </body>
</html>
